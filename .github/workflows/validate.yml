name: model-validation

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"  # weekly re-validation (ongoing monitoring)

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Lint (includes banned global RNG)
        run: ruff check .
      - name: Validation suite (merge gate)
        run: pytest -q -rw
      - name: Build validation report
        if: always()
        run: python -m pdmodel.run
      - name: Upload report as PR evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: reports/
